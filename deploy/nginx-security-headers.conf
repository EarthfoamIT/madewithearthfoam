# Security headers for madewith.earthfoam.com when it is served by nginx
# instead of Vercel. Keep in step with the "headers" in vercel.json.
#
# Include inside the site's `server { ... }` block:
#   include /etc/nginx/snippets/madewith-security-headers.conf;
#
# Note: nginx drops these if a `location` block sets its own add_header, so
# include this file in such blocks too.
#
# The two sha256 hashes are for the inline LinkedIn Insight scripts in
# index.html. If those scripts change, recompute them:
#   node -e 'const h=require("fs").readFileSync("dist/index.html","utf8");for(const m of h.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g))console.log("sha256-"+require("crypto").createHash("sha256").update(m[1]).digest("base64"))'
# If VITE_API_URL changes, update connect-src.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-XqrEPSBKuwPRIL6sy+/Nez7Qq5aDwmaeBgHueCDa9Qk=' 'sha256-jKE5Z2gidgotCt1ogupfIaTn/mmqKhh2H5y7aeftzsE=' https://snap.licdn.com https://madewithearthfoam.us18.list-manage.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://server.arcgisonline.com https://px.ads.linkedin.com https://*.linkedin.com; connect-src 'self' https://api.earthfoam.lk https://px.ads.linkedin.com https://*.linkedin.com; media-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
